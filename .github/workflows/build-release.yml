name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub Release with this tag (e.g. v1.0.0). Leave empty to only build."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"
  # Windows 语音插件用到 FlutterEngine::PostPlatformThreadTask（事件从音频线程
  # 回到平台线程）。本地在 3.47.9 上验证过，固定到同一版本。
  FLUTTER_VERSION_WINDOWS: "3.47.9"
  ANDROID_PLATFORM: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  # Preinstalled on the ubuntu-latest image. Keep it explicit so `flutter`
  # and our own sdkmanager invocation agree on the SDK location.
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The ubuntu-latest image ships the Android SDK and sdkmanager, but
      # sdkmanager is not on PATH. android-actions/setup-android@v3 currently
      # fails on its internal `sdkmanager tools` call, so invoke it directly.
      - name: Install SDK platform and build tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -n1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platform-tools"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Read app version
        id: version
        run: |
          raw="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)"
          echo "full=${raw}" >> "$GITHUB_OUTPUT"
          echo "name=${raw%%+*}" >> "$GITHUB_OUTPUT"

      # Fork PRs can't read Actions secrets. They still run analyze/test, but
      # skip the APK so they never produce a debug-signed artifact by accident.
      - name: Decode release signing keystore
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured"
            exit 1
          }
          KEYSTORE="$RUNNER_TEMP/zconnect-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build release APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          flutter build apk --release --target-platform android-arm64

      - name: Verify APK signature
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "zconnect-${{ steps.version.outputs.name }}-arm64-v8a.apk"

      - name: Upload APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: zconnect-${{ steps.version.outputs.name }}-arm64-v8a
          path: zconnect-${{ steps.version.outputs.name }}-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/zconnect-release.jks"

  macos:
    name: Analyze, test and build macOS app
    # 公开仓库上的 macos-15 是 Apple Silicon；本项目的原生依赖只出 arm64。
    # 不用 macos-14：它自带的 Xcode 最高 16.2（Swift 6.0），而
    # shared_preferences_foundation 2.6.x 生成的 Swift 需要 6.1 的
    # 尾随逗号语法，会在编译期报 "unexpected ',' separator"。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          targets: aarch64-apple-darwin

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: |
            macos/Vendor
            macos/.build
            rust/.ort
          key: macos-native-${{ hashFiles('tools/build_opus_macos.sh', 'tools/fetch_onnxruntime.sh') }}

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build native dependencies
        run: |
          uname -m
          bash tools/build_opus_macos.sh
          bash tools/build_rust_macos.sh

      - name: Build release app
        run: flutter build macos --release

      - name: Run XCTest
        run: |
          xcodebuild test \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:RunnerTests

      - name: Verify bundle
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/pp_friend.app"
          FRAMEWORKS="$APP/Contents/Frameworks"
          test -f "$FRAMEWORKS/librust_lib_pp_friend.dylib"
          test -f "$FRAMEWORKS/libonnxruntime.dylib"
          lipo -info "$FRAMEWORKS/librust_lib_pp_friend.dylib" | grep -q arm64
          lipo -info "$FRAMEWORKS/libonnxruntime.dylib" | grep -q arm64
          # 构建机的 Homebrew 路径不能漏进产物。
          if otool -L "$FRAMEWORKS/librust_lib_pp_friend.dylib" | grep -q /opt/homebrew; then
            echo "librust_lib_pp_friend.dylib 依赖了 Homebrew 库" >&2
            exit 1
          fi
          codesign --verify --deep --strict "$APP"

      - name: Read app version
        id: version
        run: |
          raw="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n1)"
          echo "name=${raw%%+*}" >> "$GITHUB_OUTPUT"

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/pp_friend.app \
            "zconnect-${{ steps.version.outputs.name }}-macos-arm64.zip"

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: zconnect-${{ steps.version.outputs.name }}-macos-arm64
          path: zconnect-${{ steps.version.outputs.name }}-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows x64 app
    runs-on: windows-latest
    steps:
      # Flutter 的 Windows 构建在 pub get / 插件构建阶段会创建符号链接，
      # 普通会话需要开发者模式。必须在 checkout 和 pub get 之前打开；
      # 两个注册表值重复写入是幂等的。
      - name: Enable Windows Developer Mode
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          if (-not (Test-Path $key)) {
            New-Item -Path $key -Force | Out-Null
          }
          New-ItemProperty -Path $key -Name AllowDevelopmentWithoutDevLicense `
            -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name AllowAllTrustedApps `
            -Value 1 -PropertyType DWord -Force | Out-Null
          Get-ItemProperty -Path $key |
            Select-Object AllowDevelopmentWithoutDevLicense, AllowAllTrustedApps |
            Format-List

      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION_WINDOWS }}
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          targets: x86_64-pc-windows-msvc

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: x86_64-pc-windows-msvc

      # miniaudio 头文件、ogg/opus 静态库、Rust DLL 和 ORT 都由脚本生成。
      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: |
            windows/Vendor
            windows/.build
          key: windows-native-${{ hashFiles('tools/fetch_miniaudio.ps1', 'tools/build_opus_windows.ps1', 'tools/build_rust_windows.ps1') }}

      - name: Build native dependencies
        shell: pwsh
        run: pwsh -File tools/build_windows.ps1

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release app
        run: flutter build windows --release

      - name: Verify bundle
        shell: pwsh
        run: |
          $release = 'build/windows/x64/runner/Release'
          $required = @(
            'pp_friend.exe',
            'rust_lib_pp_friend.dll',
            'onnxruntime.dll',
            'data/flutter_assets'
          )
          foreach ($rel in $required) {
            $path = Join-Path $release $rel
            if (-not (Test-Path $path)) {
              Write-Host "::error::缺少 $path"
              exit 1
            }
            Write-Host "    ok: $rel"
          }

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+?)\s*$' |
            Select-Object -First 1
          if (-not $line) {
            Write-Host '::error::pubspec.yaml 里读不到 version'
            exit 1
          }
          $name = ($line.Matches[0].Groups[1].Value -split '\+')[0]
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # 解压后 exe 直接在压缩包根目录，和 macOS 包里带 .app 目录不同。
      - name: Package app
        shell: pwsh
        run: |
          $release = 'build/windows/x64/runner/Release'
          $zip = "zconnect-${{ steps.version.outputs.name }}-windows-x64.zip"
          Compress-Archive -Path (Join-Path $release '*') -DestinationPath $zip -Force

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: zconnect-${{ steps.version.outputs.name }}-windows-x64
          path: zconnect-${{ steps.version.outputs.name }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    # 等三个构建都过：Release 里要同时有 APK、macOS app 和 Windows 包。
    needs: [build, macos, windows]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: zconnect-*
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            dist/*.apk
            dist/*.zip
          generate_release_notes: true
          make_latest: true
